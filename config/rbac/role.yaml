---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - trino.example.io
  resources:
  - trinoclusters
  verbs:
  - get
- apiGroups:
  - trino.example.io
  resources:
  - trinomaintenances
  - trinoroutinggroups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - trino.example.io
  resources:
  - trinomaintenances/status
  - trinoroutinggroups/status
  verbs:
  - update
