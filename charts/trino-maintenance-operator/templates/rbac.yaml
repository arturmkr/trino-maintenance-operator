{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trino-maintenance-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Keep in sync with config/rbac/role.yaml (generated from the kubebuilder RBAC markers).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [trino.example.io]
    resources: [trinoclusters]
    verbs: [get]
  - apiGroups: [trino.example.io]
    resources: [trinomaintenances, trinoroutinggroups]
    verbs: [get, list, watch]
  - apiGroups: [trino.example.io]
    resources: [trinomaintenances/status, trinoroutinggroups/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trino-maintenance-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trino-maintenance-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "trino-maintenance-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "trino-maintenance-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.metrics.enabled }}
---
# Lets the kube-apiserver delegated authn/authz of the metrics endpoint work
# (controller-runtime WithAuthenticationAndAuthorization filter).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trino-maintenance-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "trino-maintenance-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant this role to whoever scrapes the metrics endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trino-maintenance-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "trino-maintenance-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
{{- end }}
