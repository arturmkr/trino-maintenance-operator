apiVersion: apps/v1
kind: Deployment
metadata: {name: charts, namespace: trino-e2e}
spec:
  selector: {matchLabels: {app: charts}}
  template:
    metadata: {labels: {app: charts}}
    spec:
      containers:
        - name: http
          image: CHART_SERVER_IMAGE
          volumeMounts: [{name: packages, mountPath: /usr/share/nginx/html, readOnly: true}]
      volumes: [{name: packages, configMap: {name: chart-packages}}]
---
apiVersion: v1
kind: Service
metadata: {name: charts, namespace: trino-e2e}
spec:
  selector: {app: charts}
  ports: [{port: 80}]
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: upgrades, namespace: argocd}
spec:
  sourceRepos: ["http://charts.trino-e2e.svc"]
  destinations: [{server: "https://kubernetes.default.svc", namespace: trino-e2e}]
