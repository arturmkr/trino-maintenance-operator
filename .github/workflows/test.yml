name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Unit tests (no network)
        run: make test
      - name: Controller regressions (Testcontainers K3s)
        if: github.event_name == 'push'
        run: make test-controller

      - name: Lint Helm charts
        run: make helm-lint
